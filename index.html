<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalZone</title>
    <style>
        body { background: #0b0c10; color: #fff; font-family: sans-serif; padding: 15px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tabs button { background: #1f2833; color: #66fcf1; border: 1px solid #45a29e; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        .content { display: none; }
        .content.active { display: block; }
        .card { background: #1f2833; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>⚽ GoalZone</h2>
    <div class="tabs">
        <button onclick="showTab('t1')">Главная</button>
        <button onclick="showTab('t2')">Золотой мяч</button>
    </div>
    <div id="t1" class="content active">
        <div class="card"><h3>Главная</h3><p>Всё работает!</p></div>
    </div>
    <div id="t2" class="content">
        <div class="card"><h3>Золотой мяч</h3><p>Страница открылась!</p></div>
    </div>
    <script>
        function showTab(id) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
