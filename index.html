<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoalZone Elite — Элитная футбольная энциклопедия</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            padding: 12px;
            line-height: 1.6;
        }
        header {
            text-align: center;
            padding: 25px 15px;
            background: linear-gradient(135deg, #1f2833, #0b0c10);
            border-bottom: 3px solid #66fcf1;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        header h1 {
            color: #66fcf1;
            font-size: 26px;
            text-shadow: 0 0 15px rgba(102,252,241,0.4);
            margin-bottom: 6px;
        }
        header p {
            color: #8892b0;
            font-size: 13px;
        }
        /* Меню вкладок */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: #45a29e #1f2833;
        }
        .nav-tabs::-webkit-scrollbar {
            height: 6px;
        }
        .nav-tabs::-webkit-scrollbar-thumb {
            background: #45a29e;
            border-radius: 3px;
        }
        .nav-tabs button {
            background: #1f2833;
            border: 1px solid #45a29e;
            color: #c5c6c7;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        .nav-tabs button.active, .nav-tabs button:hover {
            background: #66fcf1;
            color: #0b0c10;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(102,252,241,0.5);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: #1f2833;
            border: 1px solid #28313d;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .card h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }
        .card span {
            color: #66fcf1;
            font-size: 12px;
            background: rgba(102,252,241,0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .card p {
            color: #a8b2d1;
            font-size: 13px;
        }
        .section-title {
            color: #66fcf1;
            font-size: 17px;
            margin: 18px 0 10px 0;
            border-left: 4px solid #66fcf1;
            padding-left: 8px;
            font-weight: 600;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #4a5568;
            font-size: 12px;
            margin-top: 25px;
            border-top: 1px solid #1f2833;
        }
    </style>
</head>

    <div class="nav-tabs">

        <button class="tab-btn" onclick="openTab(event, 'blowouts')">💥 Разгромы</button>
        <button class="tab-btn" onclick="openTab(event, 'scandals')">⚖️ Судьи</button>
        <button class="tab-btn" onclick="openTab(event, 'clubs')">⭐ Клубы 2026</button>
        <button class="tab-btn" onclick="openTab(event, 'goals')">🎯 Бомбардиры</button>
        <button class="tab-btn" onclick="openTab(event, 'facts')">⚡ Факты</button>
    </div>

        </div>
    </div>
